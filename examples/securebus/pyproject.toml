[project]
name = "synamcps-securebus-example"
version = "0.1.0"
description = "LangChain Chat / Attester / Executor demo for SynaMCPs securebus"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  "PyYAML>=6",
  "streamlit>=1.32",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langchain-core>=0.3",
  "playwright>=1.42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
