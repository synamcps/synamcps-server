server:
  listen_addr: ":8080"
  public_base_url: "http://localhost:8080"
  dev_mode: false

transport:
  streamable_http: true
  legacy_sse: true

web:
  enable_ui: true
  user_ui:
    enabled: true
  default_admin:
    enabled: true
    username: "admin"
    password_env_ref: "env:SYNA_ADMIN_PASSWORD"
    session_ttl_hours: 12

oauth:
  providers:
    - name: keycloak
      issuer: "https://keycloak.local/realms/syna"
      audience: "syna-mcp"
      jwks_url: "https://keycloak.local/realms/syna/protocol/openid-connect/certs"
      client_id: ""
      client_secret_env_ref: ""
    - name: google
      issuer: "https://accounts.google.com"
      audience: "syna-mcp"
      jwks_url: "https://www.googleapis.com/oauth2/v3/certs"
      client_id: ""
      client_secret_env_ref: ""
  google_allowed_domains:
    - "example.com"

oauth_as:
  enabled: true
  # Production: set to the public HTTPS origin (e.g. https://<something>.synamcps.net). Localhost breaks Claude Connectors DCR.
  public_base_url: "http://localhost:8080"
  authorization_code_ttl_seconds: 300
  access_token_ttl_hours: 24
  refresh_token_ttl_hours: 720
  default_token_mode: "read_write"
  allowed_redirect_uri_patterns:
    - "http://localhost*"
    - "http://127.0.0.1*"
    - "https://*"

teleport:
  enabled: true
  issuer: "https://teleport.local"
  audience: "syna-mcp"

redis:
  # Overridable via REDIS_ADDR / REDIS_KEY_PREFIX (control plane sets per-tenant Redis).
  addr: "redis:6379"
  password: ""
  db: 0
  key_prefix: "syna"
  ttl_hours: 24

s3:
  endpoint: "http://minio:9000"
  bucket: "knowledge"
  # Optional shared-bucket isolation (control plane sets S3_KEY_PREFIX=<slug>/).
  # key_prefix: ""
  large_document_threshold_bytes: 65536
  access_key_env_ref: "env:S3_ACCESS_KEY"
  secret_key_env_ref: "env:S3_SECRET_KEY"
  use_ssl: false

embedding:
  provider: "openai-compatible"
  model: "text-embedding-3-small"
  api: "https://api.example.com/v1/embeddings"
  api_key_env_ref: "env:EMBEDDING_API_KEY"
  max_input_tokens: 8192
  max_output_tokens: 0

summarization:
  provider: "openai-compatible"
  model: "gpt-4.1-mini"
  api: "https://api.example.com/v1/chat/completions"
  api_key_env_ref: "env:SUMMARIZATION_API_KEY"
  max_input_tokens: 8192
  max_output_tokens: 512

vector_backend:
  active: "pgvector"
  qdrant_url: "http://qdrant:6333"
  qdrant_collection: "knowledge"

metadata_catalog:
  driver: "postgres"
  # Overridable at runtime via METADATA_CATALOG_DSN or DATABASE_URL (control plane).
  dsn: "postgres://postgres:postgres@postgres:5432/syna?sslmode=disable"
  pool_max_conns: 20
  pool_min_conns: 2

chunking:
  chunk_size: 400
  overlap: 50

limits:
  max_upload_bytes: 4194304

api:
  scopes:
    - knowledge.read
    - knowledge.write
    - knowledge.search
    - knowledge.delete
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  trusted_proxy_cidrs:
    - "127.0.0.1/32"

search:
  filters:
    source_url:
      allow_partial_match: true

usage:
  enabled: true
  redis_timeseries: true
  retention_hours: 720
  default_rate_limit:
    requests_per_minute: 60
    requests_per_hour: 1000
    requests_per_day: 10000
    burst: 20
  exporters:
    prometheus:
      enabled: true
    victoriametrics:
      enabled: false
      remote_write_url: ""
      interval_seconds: 30

queue:
  rabbitmq:
    url: "" # e.g. amqp://guest:guest@rabbitmq:5672/ when profile rabbitmq is on

bus:
  kafka:
    brokers: [] # e.g. ["kafka:9092"] when profile kafka is on

mcp_proxy:
  enabled: true
  secrets_encryption_key_env_ref: "env:MCP_PROXY_SECRETS_KEY"
  session_idle_timeout_seconds: 300
  connect_timeout_seconds: 30
  call_timeout_seconds: 120

agent:
  enabled: true
  provider: "simple"
  model: "syna-simple-agent"
  api: ""
  api_key_env_ref: ""
  system_prompt: "You are a SynaMCPs assistant. Answer using the selected knowledge datasets and cite document IDs."
  max_conversation_messages: 100
  max_context_documents: 5
  max_context_chars: 6000
  max_response_tokens: 512
  conversation_ttl_hours: 720
  allowed_tools:
    - knowledge_search
    - knowledge_get
    - knowledge_save
