<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Authorize SynaMCPs</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
    .card{background:#111827;border:1px solid #334155;border-radius:12px;padding:28px;width:min(420px,92vw);box-sizing:border-box}
    h1{margin:0 0 8px;font-size:1.35rem}
    p{color:#94a3b8;margin:0 0 18px}
    label{display:block;margin:10px 0 4px}
    input,button,a.btn{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #334155;background:#020617;color:#e2e8f0}
    button,a.btn{display:inline-block;text-align:center;text-decoration:none;background:#2563eb;border-color:#2563eb;cursor:pointer;margin-top:12px}
    a.btn.secondary{background:#1e293b;border-color:#334155}
    .err{color:#fca5a5;margin-top:10px}
    .meta{font-size:.85rem;color:#64748b;margin-top:16px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Authorize Claude / MCP client</h1>
    <p>Sign in to SynaMCPs to allow <b>{{.ClientName}}</b> to access your knowledge tools.</p>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <form method="post" action="/oauth/authorize/login">
      <input type="hidden" name="login_session_id" value="{{.LoginSessionID}}"/>
      <label>Username</label>
      <input name="username" autocomplete="username" required/>
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required/>
      <button type="submit">Sign in</button>
    </form>
    {{range .Providers}}
      <a class="btn secondary" href="/oauth/authorize/oidc?login_session_id={{$.LoginSessionID}}&provider={{.Name}}">Continue with {{.Name}}</a>
    {{end}}
    <div class="meta">Client: {{.ClientID}}</div>
  </div>
</body>
</html>
